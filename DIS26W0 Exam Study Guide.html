<script>
const A='<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" class="m"/></marker></defs>';
const S=(h,b)=>`<svg viewBox="0 0 640 ${h}">${A}${b}</svg>`;
const bx=(x,y,w,h,t)=>`<rect class="b" x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/><text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle">${t}</text>`;
const ar=(a,b,c,d)=>`<line class="l" x1="${a}" y1="${b}" x2="${c}" y2="${d}" marker-end="url(#a)"/>`;
const T=[
{n:'1 OS & CPU',h:`<h2>Operating systems &amp; processor management (LU 1, 4)</h2>
<h3>Roles &amp; managers</h3><ul><li>OS = resource manager. Four managers: <b>memory, processor, device, file</b>.</li>
<li>Types: <b>batch</b> (no user interaction, payroll), <b>interactive</b> (time sharing, laptop), <b>real-time</b> (hard = deadline fatal, e.g. airbags; soft = occasional miss ok, e.g. video), <b>hybrid</b> (smartphone), <b>embedded</b> (ATM, car ECU).</li>
<li>Multiprocessing drove OS evolution; virtualization = one machine runs many virtual ones.</li></ul>
<h3>Process vs thread</h3><ul><li><b>Process</b> = program in execution. <b>Thread</b> = smaller unit inside a process; threads share code, data and open files but have own registers/stack.</li>
<li><b>Job scheduler</b> (high-level: admits jobs) vs <b>process scheduler</b> (low-level: picks who gets CPU).</li></ul>
${S(130,bx(10,50,80,34,'HOLD')+bx(140,50,80,34,'READY')+bx(270,50,80,34,'RUNNING')+bx(420,50,80,34,'FINISHED')+bx(270,105,80,24,'WAITING')+ar(90,67,140,67)+ar(220,67,270,67)+ar(350,67,420,67)+`<path class="l" d="M310 84V105" marker-end="url(#a)"/><path class="l" d="M270 117H180V84" marker-end="url(#a)"/><path class="l" d="M300 50C280 10 190 10 180 50" marker-end="url(#a)"/><text x="215" y="14">timeout/interrupt</text>`)}
<p class="dc">Process states. PCB holds: state, registers, priority, accounting. Context switch saves PCB of interrupted job so it can resume.</p>
<h3>Scheduling</h3><ul><li><b>Non-preemptive</b>: FCFS, SJF, (non-pre) priority. <b>Preemptive</b>: SRT, Round Robin.</li>
<li>RR quantum tiny = too many context switches; quantum &gt; longest burst = becomes FCFS.</li>
<li>Multi-level queues: no movement, movement, variable quantum, <b>aging</b> (stops low-priority waiting forever).</li>
<li>Interrupt handler: saves state, identifies cause, runs service routine, restores.</li></ul>
<h3>Calculate</h3><p><b>Turnaround = completion − arrival. Waiting = turnaround − burst.</b> Example FCFS: P1(arr0,b5) P2(arr1,b3) P3(arr2,b1) → Gantt P1 0-5, P2 5-8, P3 8-9. TAT = 5,7,7 avg 6.33; WT = 0,4,6 avg 3.33. SJF non-pre: P1, then P3 (5-6), P2 (6-9): TAT 5,8,4 avg 5.67. Check: chart end = sum of bursts (9) if CPU never idles.</p><h3>From your slides (Ch 1 &amp; 4)</h3><ul><li><b>Pyramid</b>: user interface (GUI/CLI) over memory, processor, device and file managers (+ network manager if networked). Managers monitor resources, enforce policy (who gets what, when, how much), allocate and deallocate.</li><li>RAM = volatile, memory manager checks requests and protects OS space. ROM = non-volatile, holds firmware that loads the OS at power-on.</li><li><b>Timeline</b>: 1940s operators at console · 1950s batch/job scheduling · 1960s multiprogramming (passive = interrupts, active = time slicing) · 1970s virtual memory · 1980s multiprocessing, firmware · 1990s Internet and security · 2000s virtual machines, multicore · 2010s mobility. <b>Moore’s Law</b>: capacity doubles every 18–24 months.</li><li>Batch efficiency = throughput; interactive = faster turnaround than batch; <b>hybrid</b> = interactive load with batch in background; <b>embedded</b> = small kernel, fixed programs (pacemaker, elevator); network OS = cloud use. Hard real-time (missed deadline = total failure, fly-by-wire) vs soft (degraded performance).</li></ul>
<h3>Process states &amp; control blocks</h3><ul><li>HOLD→READY: Job Scheduler. READY→RUNNING: Process Scheduler. RUNNING→READY: time slice ends. RUNNING→WAITING: job needs unavailable resource/I/O. WAITING→READY: I/O manager signal. →FINISHED: done (OK or error).</li><li><b>Thread states</b>: READY, RUNNING, WAITING, DELAYED (timed sleep), BLOCKED (I/O).</li><li><b>PCB</b>: process ID, status, state (status word, registers), memory, resources, priority, accounting. <b>TCB</b>: thread ID, state, CPU info (program counter, registers), priority, pointer to parent process, child threads. PCBs (not jobs) are linked to form queues.</li><li>I/O-bound jobs: many short CPU cycles. CPU-bound: long cycles. Middle-level scheduler (interactive systems) swaps jobs out to lower multiprogramming.</li><li>Multi-core: several cores on one chip run calculations simultaneously and reduce heat/leakage problems.</li></ul>
<h3>Policy goals &amp; algorithms</h3><p>Goals: max throughput, min response, turnaround and waiting time, max CPU efficiency, fairness. Preemptive = interrupts a running job (time sharing). Non-preemptive = no interrupts.</p><table><tr><th>Algo</th><th>Type</th><th>+</th><th>−</th></tr><tr><td>FCFS</td><td>Non</td><td>Easy, FIFO queue, batch</td><td>Unpredictable TAT (A,B,C avg 16.67 vs C,B,A 7.3)</td></tr><tr><td>SJN/SJF</td><td>Non</td><td>Min avg wait, optimal if all present</td><td>Postponement of long jobs; needs times in advance</td></tr><tr><td>Priority</td><td>Non</td><td>Important jobs fast</td><td>Postponement; fix with aging</td></tr><tr><td>SRT</td><td>Pre</td><td>Short jobs first</td><td>More overhead; needs CPU times</td></tr><tr><td>Round Robin</td><td>Pre</td><td>Fair, good response</td><td>Needs good quantum</td></tr><tr><td>EDF</td><td>Pre</td><td>Real-time deadlines</td><td>Overhead</td></tr></table><ul><li>RR quantum rules of thumb: long enough for 80% of CPU cycles to finish, at least 100× the context-switch time. Priority can come from memory needs, devices, total CPU time, or aging.</li><li><b>Multi-level queues</b>: Case 1 no movement (FCFS inside, low queue only when higher empty) · Case 2 movement (preempted job drops a queue) · Case 3 variable quantum (each queue’s quantum twice the previous) · Case 4 aging (old jobs move up).</li><li><b>Interrupts</b>: page, quantum expiry, I/O, internal/synchronous (divide by zero, illegal instruction). Handler: describe and store type → save interrupted state → process → resume.</li></ul>`,
c:['Types of OS + example each','Four managers','Process vs thread; what threads share','Process states + PCB + context switch','FCFS/SJF/SRT/RR Gantt charts','TAT and waiting time averages','Preemptive vs non-preemptive; RR quantum; aging']},
{n:'2 Memory',h:`<h2>Memory management (LU 2, 3)</h2>
<h3>Early schemes</h3><ul><li><b>Single-user contiguous</b>: one job, simple, wastes memory. <b>Fixed partitions</b>: internal fragmentation. <b>Dynamic</b>: external fragmentation. <b>Relocatable dynamic</b>: compaction removes holes (costs CPU time, needs relocation + <b>bounds register</b>).</li>
<li><b>First-fit</b>: first block big enough (fast). <b>Best-fit</b>: smallest block big enough (less waste, slower search).</li>
<li>Deallocation: join 2 free blocks, join 3, or isolated block (new entry in memory list).</li></ul>
${S(90,bx(10,20,100,40,'Job A 20K')+bx(110,20,70,40,'free 8K')+bx(180,20,110,40,'Job B 30K')+bx(290,20,60,40,'free 5K')+bx(350,20,100,40,'Job C 25K')+`<text x="10" y="82" class="dc">External fragmentation: free 8K+5K cannot host a 12K job. Compaction slides jobs together.</text>`)}
<h3>Virtual memory</h3><ul><li><b>Paging</b>: fixed-size pages → page frames, page table maps them. No external fragmentation. <b>Segmentation</b>: variable logical units. Also demand paging and segmented/demand paged.</li>
<li><b>Page fault</b>: needed page not in memory → OS loads it. <b>Thrashing</b>: excessive faulting, almost no useful work. <b>Working set</b>: pages a process needs now.</li>
<li><b>Cache</b>: fast memory between main memory and CPU registers → faster response. (Not same as virtual memory.)</li></ul>
${S(110,bx(20,10,90,26,'Page 0')+bx(20,40,90,26,'Page 1')+bx(20,70,90,26,'Page 2')+bx(250,10,90,26,'Frame 0')+bx(250,40,90,26,'Frame 1')+bx(250,70,90,26,'Frame 2')+ar(110,23,250,70)+ar(110,53,250,23)+ar(110,83,250,53)+'<text x="400" y="55">Page table: 0→2, 1→0, 2→1</text>')}
<h3>Trace FIFO vs LRU (3 frames)</h3><p>Requests 1 2 3 4 1 2 5 1 2 3 4 5. <b>FIFO = 9 faults</b> (evict oldest loaded). <b>LRU = 10 faults</b> (evict least recently used). FIFO can show Belady’s anomaly. Always draw the frame table step by step.</p><h3>From your slides (Ch 2 &amp; 3)</h3><ul><li>Fixed partitions: first available partition that fits, internal fragmentation, static (shutdown to change). Dynamic: first come first served, external fragmentation. Hypothetical: next-fit (resume from last block), worst-fit (largest block).</li><li>First-fit list ordered by <b>address</b>; best-fit list ordered by <b>size</b> and searches the whole table. Example: 200 requested, first-fit takes 6785 (600→400 left at 6985); best-fit takes 7600 (205→5 left at 7800).</li><li>Deallocation cases: <b>Case 1</b> join with one free neighbour (200+5=205) · <b>Case 2</b> between two free blocks (20+20+205=245, extra entry becomes null) · <b>Case 3</b> isolated: busy entry becomes null, new free entry.</li><li>Compaction relocates jobs; <b>relocation register</b> holds adjustment value (0 if unmoved), <b>bounds register</b> holds highest accessible address. Timing: when X% busy, when jobs wait, or periodically. It is overhead.</li><li>All four early schemes: whole program in memory, contiguous, until done.</li></ul>
<h3>Paging mechanics</h3><ul><li>Tables: <b>Job Table</b> (size, PMT location), <b>Page Map Table</b> (page → frame), <b>Memory Map Table</b> (frame free/busy).</li><li><b>Address resolution</b>: page number = address ÷ page size (quotient), offset = remainder. Physical = frame × size + offset. Example: size 512, address 1052 → page 2, offset 28; if page 2 sits in frame 5, physical = 5×512+28 = 2588.</li><li>350-byte job, 100-byte frames → 4 pages, internal fragmentation only on the last page. Page size too small = long PMTs; too large = more internal fragmentation.</li><li>Demand-paging PMT bits: <b>status</b> (in memory), <b>modified</b> (must rewrite to disk), <b>referenced</b> (used recently). Page fault handler loads page, or swaps if no free frame.</li><li>Segmentation: logical, variable, visible to program; Segment Map Table; 2-D address (segment, displacement); external fragmentation. Segmented/demand paged: 3-D address, four tables (JT, SMT, PMT, MMT), associative memory (fast, costly).</li><li>Virtual memory: job not limited by RAM, more multiprogramming, sharing; costs hardware, interrupt overhead, thrashing risk. Thrashing occurs within a job (loop crossing pages) or across many jobs.</li><li>Cache: L1 in CPU, L2 beside it. <b>Avg access = cache time + (1 − hit ratio) × main memory time</b>; 80–90% hit rate possible.</li></ul>
<h3>Slide trace: 2 frames, requests A B A C A B D B A C D</h3><p>FIFO = <b>9 faults</b>, LRU = <b>8 faults</b> (11 requests). FIFO can get worse with more frames (Belady anomaly); LRU cannot. Failure rate = faults ÷ requests.</p>`,
c:['Four early schemes + pros/cons','First-fit vs best-fit placement','Deallocation (2 / 3 / isolated)','Internal vs external fragmentation; compaction','Paging, segmentation, page tables, faults','FIFO and LRU traces','Thrashing, working set, cache']},
{n:'3 Deadlock',h:`<h2>Deadlock &amp; process management (LU 5)</h2>
<ul><li><b>Deadlock</b>: processes wait forever for resources held by each other.</li>
<li>Seven cases: file requests, databases, dedicated devices, multiple devices, spooling (disk full of partial print jobs), networks, disk sharing.</li></ul>
<h3>Four necessary conditions (all at once)</h3><ul><li><b>Mutual exclusion</b> – resource used by one process at a time.</li><li><b>Hold and wait</b> – holds one, requests another.</li><li><b>No preemption</b> – cannot be taken away.</li><li><b>Circular wait</b> – a cycle of waiting. Remove any ONE to prevent deadlock.</li></ul>
${S(130,'<circle class="b" cx="120" cy="30" r="22"/><text x="120" y="34" text-anchor="middle">P1</text><circle class="b" cx="320" cy="30" r="22"/><text x="320" y="34" text-anchor="middle">P2</text>'+bx(100,90,40,30,'R1')+bx(300,90,40,30,'R2')+ar(120,90,120,52)+ar(320,52,320,90)+ar(140,105,300,105).replace('y2="105"','y2="105"')+`<text x="400" y="40">R1 held by P1 (allocated to)</text><text x="400" y="60">P1 waits for R2 (waiting for)</text><text x="400" y="80">Cycle = deadlock</text>`)}
<h3>Strategies</h3><ul><li><b>Prevention</b> removes a condition. <b>Avoidance</b> (Banker’s) checks each request. <b>Detection</b> finds it via graph; <b>recovery</b> kills/preempts a victim (by work done, priority, resources held).</li>
<li>Unsafe state ≠ deadlock yet. <b>Starvation</b>: process never gets resource (fix: aging). <b>Race</b>: outcome depends on timing (fix: mutual exclusion/locks).</li></ul>
<h3>Banker’s Algorithm</h3><p>Capital 100: A loan 20 max 70, B loan 40 max 60, C loan 10 max 50. Remaining capital = 100−70 = 30. Remaining credit: A 50, B 20, C 40. B (20≤30) repays → capital 70; then A 50≤70 → capital 90; then C. <b>Safe sequence B, A, C.</b> If no customer’s need fits, state is unsafe.</p><h3>From your slides (Ch 5)</h3><ul><li>Staircase analogy: <b>deadlock</b> = two meet on the stairs, neither retreats; <b>livelock</b> = both keep side-stepping in sync; <b>starvation</b> = waiting for a break that never comes.</li><li>Cases: (1) <b>files</b> P1 holds F1 wants F2, P2 reverse · (2) <b>databases</b> record locks (without locks you get a race and wrong data) · (3) <b>dedicated devices</b> two recorders, two processes · (4) <b>multiple devices</b> scanner/printer/plotter ring of 3 · (5) <b>spooling</b> disk fills with partial print jobs · (6) <b>networks</b> (textbook case: nodes hold buffers while waiting for each other) · (7) <b>disk sharing</b> is a livelock: arm bounces between track 20 and 310.</li><li>Graph: circles = processes, squares = resources, solid arrow resource→process = holds, dashed process→resource = waits. A cycle = deadlock. Scenario 2: P1 holds R1 wants R2, P2 holds R2 wants R3, P3 holds R3 wants R1.</li><li><b>Prevention per condition</b>: mutual exclusion → spooling · hold and wait → request everything up front (lowers multiprogramming) · no preemption → OS takes resources (hard for devices mid-update) · circular wait → numbered resource ordering.</li><li>Banker’s: bank $10,000. Customers loan/max: #1 0/4,000, #2 2,000/5,000, #3 4,000/8,000. Remaining credit 4,000, 3,000, 4,000. Loaned 6,000, remaining capital 4,000 → <b>safe</b> (#1 can finish, returns loan, etc.). Second state: loans 2,000/3,000/4,000 = 9,000, capital left 1,000, all need ≥2,000 → <b>unsafe</b>. Same with devices: 10 total, 9 allocated, every job needs ≥2 but 1 free.</li><li>Banker’s limits: jobs must declare maximum, fixed number of jobs and resources, worst-case assumption wastes resources.</li><li>Detection: build graph, remove process holding resources and not waiting, remove process waiting for one not-fully-allocated class, repeat. Fully reduced = no deadlock; leftover lines = deadlock.</li><li>Recovery: terminate all jobs · terminate only involved jobs, one at a time · preempt a non-deadlocked job’s resources (snapshot) · stop new jobs (no victim). Victim choice: low priority, little CPU used, few other jobs affected, not mid data update.</li><li>Starvation: conservative allocation (Dining Philosophers needing two forks). Fix: track waiting time (aging), block new jobs until starved ones run.</li></ul>`,
c:['Seven deadlock cases','Four conditions + spot in scenario','Resource allocation graph cycle','Prevention vs avoidance; detection vs recovery','Banker’s safe-state calculation','Starvation, aging, race condition']},
{n:'4 Files',h:`<h2>File management (LU 6 / Ch 8)</h2>
<ul><li>File manager: creates, stores, retrieves, protects files; access control verification module checks permission. Levels: basic file system, access control, logical, physical.</li>
<li>Names: extension shows type. <b>Absolute</b> = full path from root; <b>relative</b> = from current directory. A directory is a file flagged as subdirectory.</li></ul>
${S(70,bx(10,15,100,36,'Field')+ar(110,33,160,33)+bx(160,15,100,36,'Record')+ar(260,33,310,33)+bx(310,15,100,36,'File')+ar(410,33,460,33)+bx(460,15,110,36,'Database'))}
<h3>Key comparisons</h3><table><tr><th>Topic</th><th>Options</th></tr>
<tr><td>Records</td><td>Fixed: fast, simple, wastes space. Variable: saves space, harder to locate.</td></tr>
<tr><td>Organization</td><td>Sequential (batch, tape) · Direct (hashing, fast random) · Indexed sequential (both, needs index).</td></tr>
<tr><td>Allocation</td><td>Contiguous (fast, fragmentation, hard to grow) · Non-contiguous (flexible, slower, pointers) · Indexed (index block, direct access, index overhead).</td></tr>
<tr><td>Access control</td><td>Matrix (users × files, big/sparse) · ACL (list per file) · Capability list (list per user).</td></tr>
<tr><td>Compression</td><td>Lossless (exact restore: text, code) · Lossy (discards data: JPEG, MP3).</td></tr></table><h3>From your slides (Ch 8)</h3><ul><li>File manager’s four tasks: track storage, enforce policy, allocate (after access check, record use), deallocate (return to storage, notify waiting processes). Commands (OPEN, DELETE, RENAME, COPY) are device-independent; a READ becomes: move head, wait rotational delay, read, transfer to memory, signal free.</li><li><b>Flat file</b> has no links to other files. Program files hold instructions, data files hold data, directories list filenames and attributes.</li><li><b>Volume</b> = storage unit; volume descriptor, then <b>Master File Directory (MFD)</b>, then storage. Single-directory drawbacks: slow search, unique names needed, no user folders. Subdirectories are files flagged in the MFD; the directory is an upside-down tree. <b>File descriptor</b>: name, type, size, location, date, owner, protection, record size.</li><li>Names: relative = no path, absolute = full path. Windows not case-sensitive, extension required; Linux/UNIX case-sensitive, extension not required. Extensions are 2–4 chars after a period.</li><li>Direct files use <b>hashing</b>, so two keys can <b>collide</b> on one address. <b>ISAM</b>: ordered file in equal blocks, index holds each block’s highest key and location, no collisions, overflow areas for new records.</li><li>Noncontiguous: records in linked <b>extents</b> (no fragmentation or compaction, but no direct access). Indexed: one <b>index block</b> per file points to every extent (sequential and direct, large files need multi-level index). Contiguous: easy direct access, hard to expand.</li><li><b>CBA</b> (current byte address): sequential fixed CBA = CBA + RL; variable CBA = CBA + N + RL. Direct fixed CBA = (RN − 1) × RL, e.g. RL 100, record 5 → 400. Variable-length direct access is practically impossible.</li><li>Levels: basic file system, access control verification, logical file system (record no. → byte address), device interface; each verifies its piece.</li><li>Matrix example: RWED = read/write/execute/delete. ACL groups users as SYSTEM, OWNER, GROUP, WORLD. Capability list is per user and the most storage-efficient.</li><li>Compression: repeated characters, repeated terms, front-end compression. Lossless for text/arithmetic; lossy for images/sound (JPEG, MPEG), irreversible.</li></ul>`,
c:['Names, extensions, absolute vs relative','Field → record → file → database','Fixed vs variable records','Sequential, direct, indexed sequential','Contiguous, non-contiguous, indexed allocation','Matrix, ACL, capability list','Lossless vs lossy']},
{n:'5 DS Basics',h:`<h2>Characterization of distributed systems (LU 8)</h2>
<ul><li><b>Distributed system</b>: independent computers (nodes) coordinating over a network that appear to users as one coherent system (e.g. Netflix, Uber, banking apps).</li>
<li>Three characteristics: <b>concurrency</b>, <b>no global clock</b>, <b>independent failure</b>.</li>
<li>Built for <b>resource sharing</b> (needs naming, locating, concurrency control) and <b>scalability</b>. Trends: containers/orchestration, edge, AI at scale, serverless.</li></ul>
<h3>Challenges</h3><p>Heterogeneity (different hardware/OS) · Openness (published interfaces) · Security · Scalability · Failure handling · Concurrency · Transparency · Quality of service · Consistency.</p>
<h3>Transparency types</h3><p>Access (same way to use), Location (don’t know where), Concurrency (users don’t interfere), Replication (copies hidden), Failure (faults hidden), Mobility (resources move unnoticed).</p>
<ul><li><b>Concurrency</b> = many tasks progress over same period; <b>parallelism</b> = many tasks at the exact same instant.</li><li><b>Replica</b> = copy; <b>source of truth</b> = authoritative copy others refer to.</li></ul>
${S(190,'<polygon points="320,20 130,170 510,170" fill="none" stroke="var(--ac)" stroke-width="2"/>'+`<text x="320" y="14" text-anchor="middle">Consistency</text><text x="100" y="185" text-anchor="middle">Availability</text><text x="540" y="185" text-anchor="middle">Partition tolerance</text><text x="320" y="130" text-anchor="middle" class="dc">pick at most 2 (CP or AP)</text>`)}
<p><b>CAP</b>: during a network partition choose consistency (banking, stock) or availability (social feed, streaming).</p><h3>From your slides (LU 8 + Mod-2)</h3><ul><li>Definitions: Coulouris = components at networked computers that communicate and coordinate <b>only by message passing</b>. Tanenbaum = independent computers that appear as a single computer. Lamport: the crash of a computer you have never heard of stops your work.</li><li>Network vs DS: network nodes are visible and addressed (IP); in a DS the many computers are transparent. Networks focus on packets and routing; DS focus on applications. Multiprocessors share memory; DS pass messages.</li><li>Why built: functional separation, inherent distribution, load and power imbalance, resource sharing. Goals: connect users and resources, transparency, openness, scalability, availability.</li><li>Characteristics: concurrency, heterogeneity, no global state, no global clock (ms precision at best), independent failures, no shared memory. Fixes: logical clocks, TrueTime (Spanner), Kubernetes restarts pods, Chaos Monkey.</li><li><b>Eight fallacies</b>: network reliable, secure, homogeneous; topology fixed; latency zero; bandwidth infinite; transport cost zero; one administrator.</li><li>Examples: cloud (AWS, Azure), streaming (Netflix), ride-share (Uber), messaging (WhatsApp), fintech (Stripe, Kafka event streams), AI/GPU training, IoT, gaming (Fortnite). Blockchain: consensus, no central owner. Google: Borg/Kubernetes, Spanner, Bigtable, gRPC. Netflix: 700+ microservices, Chaos Monkey, Open Connect CDN.</li><li>Resource sharing needs: a namespace, name → address (DNS), synchronizing concurrent users. Multi-tenancy in the cloud.</li><li>Challenge answers: heterogeneity → containers/middleware · openness → REST, gRPC, open APIs · security → confidentiality, integrity, availability, non-repudiation, zero trust; tools: encryption, authentication, ACLs · scalability → horizontal auto-scaling, avoid central bottlenecks · failure → detection (checksums, heartbeats), masking (retransmission), toleration (timeouts), recovery (rollback) · concurrency → locks, fair scheduling, avoid deadlock · QoS → SLAs (five nines 99.999%), tracing, monitoring.</li><li>Transparency examples: access (Drive file local or remote), location (CDN), concurrency (Google Docs), replication (read replica, DNS), failure (load balancer reroutes), mobility (call across towers). Extra: performance, persistence, transaction.</li><li>Trends: Kubernetes (scheduling, self-healing, auto-scaling, service discovery), edge (low latency, less bandwidth, autonomous cars), distributed AI training, serverless/FaaS (Lambda, scales to zero).</li><li>CAP: AP = Cassandra, DynamoDB; CP = MongoDB, HBase, Spanner. Banking favours C, social feeds favour A.</li></ul>`,
c:['Definition explained with an example','Three characteristics','Nine challenges','Six transparency types','Concurrency vs parallelism','Replication, source of truth','CAP: choose C or A with justification','Trends: containers, edge, AI, serverless']},
{n:'6 Models',h:`<h2>System models (LU 9)</h2>
<ul><li><b>Physical</b>: hardware/computers and networks. <b>Architectural</b>: structure, entities, paradigms, roles. <b>Fundamental</b>: abstract properties – interaction, failure, security.</li>
<li>Entities: system-oriented (nodes, processes) · problem-oriented (objects, components, web services).</li>
<li>Paradigms: <b>IPC</b> (message passing, sockets, multicast) · <b>remote invocation</b> (request-reply, RPC, RMI) · <b>indirect</b> (group comms, publish-subscribe, message queues, tuple spaces, DSM).</li>
<li><b>Middleware</b> hides differences in hardware/OS and gives a single-system view and programming model.</li></ul>
${S(150,bx(10,10,90,28,'Client')+bx(10,50,90,28,'Client')+bx(200,25,90,40,'Server')+ar(100,24,200,40)+ar(100,64,200,52)+'<text x="10" y="105" class="dc">Client-server: simple, central, but single point of failure</text>'+bx(380,10,60,28,'Peer')+bx(520,10,60,28,'Peer')+bx(450,60,60,28,'Peer')+ar(440,24,520,24)+ar(525,38,510,62)+ar(450,62,420,38)+'<text x="380" y="105" class="dc">P2P: fault tolerant, harder to manage</text>')}
${S(70,bx(10,15,120,36,'Presentation')+ar(130,33,190,33)+bx(190,15,120,36,'Application')+ar(310,33,370,33)+bx(370,15,120,36,'Data tier'))}
<p class="dc">Multi-tier: separates concerns; challenges are latency across tiers and complexity.</p>
<h3>Fundamental models</h3><ul><li><b>Interaction</b>: latency, bandwidth, jitter; synchronous system (known time bounds) vs asynchronous (no bounds, clock drift).</li>
<li><b>Synchronous communication</b>: sender waits (phone call). <b>Asynchronous</b>: sender continues (email).</li>
<li><b>Failure</b>: omission = fails to perform action it should. Process omission (crash; fail-stop if detectable) · communication omissions: send, receive, channel.</li>
<li><b>Security</b>: threats to processes, channels and objects; protect against eavesdropping, tampering, impersonation.</li></ul><h3>From your slides (LU 9)</h3><ul><li>Physical = hardware and networks. Architectural = tasks of computational elements and their communication. Fundamental = abstract look at interaction, failure, security. Four questions: who talks, how, what roles, where it runs.</li><li>Entities: system view (nodes, threads/processes) vs programmer view (objects, components, web services usable by any program on the web).</li><li>IPC: message passing shares no memory; sockets are endpoints (TCP reliable, ordered; UDP fast, no guarantee); multicast = one message to a group. Remote invocation: <b>RPC</b> looks like a local function call; <b>RMI</b> calls a method on a remote object; both machines must be up. Indirect: group communication, publish-subscribe (topic), message queues (wait in line), tuple spaces (notice-board), DSM.</li><li>Client-server (restaurant): central control, consistency; but single point of failure and bottleneck. P2P: equal roles, more fault tolerant. Multi-tier (client, logic, data): complexity, latency per hop, cost and coordination.</li><li>Middleware categories: distributed objects/components, publish-subscribe, message queues, transaction processing, web services, P2P. Role: hide heterogeneity, consistent programming model.</li><li>Interaction: communication + coordination. Latency (delay), bandwidth (capacity), jitter (variation). Clock drift means m2 can arrive before m1. <b>Synchronous system</b>: known bounds on process speed, message delay, drift. <b>Asynchronous</b>: no bounds.</li><li><b>Synchronous communication</b> = sender blocks (phone call, blocking RPC, tap Pay and wait). <b>Asynchronous</b> = sender carries on (SMS, e-mail, queue, notification).</li><li>Failure: process omission = crash (fail-stop if everyone can tell for certain). Communication omission = send-omission (never leaves), receive-omission (never arrives), channel omission (lost en route).</li></ul>`,
c:['Physical, architectural, fundamental models','IPC, remote invocation, indirect examples','Client-server, P2P, multi-tier diagrams','Middleware role','Latency, bandwidth, jitter, clock drift','Omission failures','Security model']},
{n:'7 Web',h:`<h2>Distributed web-based systems (LU 10)</h2>
<ul><li>Traditional web: browser ↔ web server, static pages; evolved to dynamic content and services.</li>
<li><b>Web service</b>: software accessed over the web by programs. Styles: <b>SOAP</b> (XML, WSDL, heavy) vs <b>REST</b> (standard HTTP methods, simple, interoperable).</li>
<li>Processes: clients, Apache web server, <b>web server cluster</b> (load balancer spreads requests → scalability + availability).</li></ul>
${S(120,bx(10,40,80,36,'Browser')+ar(90,58,170,58)+bx(170,40,100,36,'Load balancer')+ar(270,52,370,22)+ar(270,58,370,58)+ar(270,64,370,94)+bx(370,5,100,34,'Server 1')+bx(370,42,100,34,'Server 2')+bx(370,80,100,34,'Server 3'))}
<h3>HTTP</h3><ul><li>Request-response protocol between browser and server. <b>Persistent</b> connection reuses one TCP connection; <b>non-persistent</b> opens one per object.</li>
<li>Methods: <b>GET</b> read · <b>POST</b> create/submit · <b>PUT</b> update/replace · <b>DELETE</b> remove · <b>HEAD</b> headers only.</li>
<li>Request: method + URL + version, headers, body. Response: status line, headers, body. Codes: 200 OK, 301 moved, 404 not found, 500 server error.</li></ul><h3>From your slides (LU 10)</h3><ul><li>Traditional web: browser asks server for a static file by HTTP GET; <b>stateless</b>, same page for everyone. Limits: static, CGI as workaround, tied to human readers, manual scaling.</li><li>W3C web service: identified by a URI, interfaces defined, described and discovered, interacts with software agents using standard Internet messages. Data in XML/JSON, self-describing, loosely coupled.</li><li><b>SOAP</b>: strict XML, WSDL contract, built-in security/reliability, verbose. <b>REST</b>: architectural style, HTTP methods on resources, lightweight JSON.</li><li>Traditional vs service: audience human vs program · HTML vs XML/JSON · tightly vs loosely coupled · browsing vs weather API.</li><li>Browser: builds requests, manages connections, renders HTML/CSS/JS, caches. <b>Apache</b>: serves static files, modules (rewrite, compression, auth), virtual hosting, forwards to application servers. <b>Cluster</b> + load balancer: scalability and availability, reroutes if a server fails.</li><li>HTTP: request-response, stateless, text-based, over TCP (port 80 HTTP, 443 HTTPS). Non-persistent (HTTP/1.0): one connection per object. Persistent (HTTP/1.1, keep-alive): reuse.</li><li>Methods: GET read · POST submit/create · PUT replace · DELETE remove · HEAD headers only. Request: line (GET /index.html HTTP/1.1), headers, optional body. Response: status line (HTTP/1.1 200 OK), headers, body.</li><li>Status classes: 1xx info, 2xx success, 3xx redirect (301), 4xx client error (404), 5xx server error (500).</li><li>Cycle: open TCP → send request → server parses → finds file or asks app server → builds response → browser renders, repeat per resource.</li></ul>`,
c:['Traditional web vs web service','SOAP vs REST','Apache and web server cluster','HTTP persistent vs non-persistent','GET/POST/PUT/DELETE/HEAD','Request/response structure and status codes']},
